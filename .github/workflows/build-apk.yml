name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # 用 22.04：libtool 2.4.6 与 p4a 自带的 libffi 兼容
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Chinese font
        run: |
          mkdir -p assets
          curl -L --retry 3 --max-time 300 \
            -o assets/NotoSansCJKsc-Regular.otf \
            https://fastly.jsdelivr.net/gh/googlefonts/noto-cjk@main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          ls -lh assets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev libtinfo5

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
          # 固定 p4a 版本：2024.1.21 默认用 Python 3.11，Kivy 2.3.1 能编译
          pip install python-for-android==2024.1.21

      - name: Show versions
        run: |
          python -c "import pythonforandroid; print('p4a', pythonforandroid.__version__)"
          buildozer --version

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: careertest-apk
          path: bin/*.apk
          if-no-files-found: error
